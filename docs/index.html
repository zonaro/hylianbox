  <!-- JSON-LD: FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "O HylianBox vem com ROMs inclusas?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não. O HylianBox não distribui, baixa ou inclui ROMs base. Para jogar, você importa sua cópia legal de Ocarina of Time ou Majora's Mask em Configurações → Importar ROM base. O app normaliza o formato (.z64/.v64/.n64) e valida antes de usar."
        }
      },
      {
        "@type": "Question",
        "name": "Como funciona a Loja de Hacks?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A Loja reúne centenas de hacks de OoT e MM com capa, autor e descrição. Ao tocar em Baixar, o app baixa o patch (BPS, IPS ou xDelta, mesmo dentro de ZIP), valida o checksum e aplica automaticamente numa cópia em cache — sua ROM original nunca é alterada."
        }
      },
      {
        "@type": "Question",
        "name": "O que é ButtonStick e Auto-Z?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "ButtonStick: segure um botão C e arraste com o mesmo dedo — ele vira um analógico. Com 2 dedos na tela, vira botão normal para o analógico flutuante ter prioridade. Auto-Z: toque duplo na área do analógico segura o Z para travar a mira, sem precisar manter pressionado."
        }
      },
      {
        "@type": "Question",
        "name": "O que é o Auto-Ocarina?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Esqueceu uma música no meio da dungeon? Abra o menu de pausa, escolha a canção e o HylianBox toca as notas por você (~330 ms por nota), com HUD mostrando o progresso. Funciona com as 12 músicas de OoT, 11 de MM e músicas custom do hack."
        }
      },
      {
        "@type": "Question",
        "name": "Como funciona o Item Tracker?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "O Item Tracker tem 5 abas (Itens, Locais, Músicas, Dicas e Upgrades) e timer integrado. No modo automático para randomizer, ele lê seu save e marca tudo sozinho; no vanilla, use manual para acompanhar sua jornada. Ícones são extraídos da sua própria ROM."
        }
      },
      {
        "@type": "Question",
        "name": "Preciso preparar arquivos complicados para jogar?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Não. Depois de importar sua ROM própria, o app identifica a aventura compatível e prepara o jogo sem alterar permanentemente o arquivo original."
        }
      },
      {
        "@type": "Question",
        "name": "O app funciona offline?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sim. Depois de preparar a aventura no aplicativo, você pode jogar sem conexão. O catálogo e o RetroAchievements usam internet apenas para atualizar e sincronizar conquistas."
        }
      },
      {
        "@type": "Question",
        "name": "O que é o Dashboard no PC?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ative o servidor no celular e abra o navegador no PC na mesma Wi-Fi. Você gerencia a coleção, faz backup/restauração de saves em ZIP e até joga por streaming via WebRTC — sem instalar nada no computador."
        }
      },
      {
        "@type": "Question",
        "name": "Qual a licença do projeto?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "GPL-3.0. O HylianBox é software livre e seu código-fonte está disponível para consulta. Não é afiliado à Nintendo."
        }
      }
    ]
  }
